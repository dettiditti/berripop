# Every hour: asks the site to send the iPhone notifications that are due
# (Berri's morning thought, the afternoon "Don't forget yourself" reminder). Vercel's Hobby plan runs
# crons only once a day, so this free scheduler drives the hourly job.
# Needs the repository secret CRON_SECRET (the same value as on Vercel);
# without it the job does nothing.
name: Hourly notifications

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the notification job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://www.berripop.com/api/cron/reminders
